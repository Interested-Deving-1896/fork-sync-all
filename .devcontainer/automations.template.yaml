# ── Legacy Ona compatibility ──────────────────────────────────────────────────
# Tasks/services template retained for existing Ona environments through the
# Ona Cloud shutdown. Codex Cloud setup uses the repository's Dev Container and
# records its tested install script and start skill in the published environment.
#
# To activate: copy or rename this file to .ona/automations.yaml in your repo.
#
# Provider-neutral agent metadata lives in config/ai-agent-badges.json.
# ─────────────────────────────────────────────────────────────────────────────

services:
  headroom-proxy:
    name: Headroom Proxy
    description: >
      Context compression proxy for AI agents. Sits on port 8787 and compresses
      tool outputs, logs, and conversation history before they reach the LLM.
      Reduces token consumption by 60-95% on typical agent workloads.
      Use with: ANTHROPIC_BASE_URL=http://localhost:8787 or headroom wrap claude.
    commands:
      start: headroom proxy --port 8787 --no-ccr-inject-tool
      ready: curl -sf http://localhost:8787/livez

  sync-in-server:
    name: Sync-in Server
    description: >
      Local Sync-in server instance. Makes this devcontainer a self-contained
      infrastructure node in the Sync-in federated mesh. Starts automatically
      on port 3284. Admin token is generated on first start and stored in
      ~/.local/share/sync-in/.admin_token.
    commands:
      start: bash services/sync-in/start.sh
      ready: curl -sf http://localhost:3284/api/v1/health

tasks:
  install-sync-in:
    name: Install Sync-in Server
    description: >
      Downloads and installs the sync-in-server binary to ~/.local/bin.
      Skips if already installed. Set FORCE=true to reinstall.
      Use this after container creation if the devcontainer feature or
      postCreateCommand did not run (e.g. on a bare VM or CI runner).
    command: bash services/sync-in/install.sh
