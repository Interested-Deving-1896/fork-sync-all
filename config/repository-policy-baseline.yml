# Versioned repository policy baseline for Fork-Sync-All consumers.
# This is desired policy, not an instruction to mutate every repository immediately.
# Enforcement is role-aware and must be preceded by a read-only drift report.
schema_version: 1
policy_version: "1.0.0"

defaults:
  repository:
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    delete_branch_on_merge: true
    vulnerability_alerts: true
    automated_security_fixes: true
  branch_protection:
    enforce_admins: false
    allow_force_pushes: false
    allow_deletions: false
    require_conversation_resolution: true
    strict_required_status_checks: true

# CI is required only where the profile guarantees the named aggregate gate.
# Do not guess individual job names: require the stable aggregate gate instead.
profiles:
  # Do not assume that template membership implies a CI status context.
  # Enable CI only after the target default branch actually publishes the gate.
  full:
    require_ci: false
    required_status_checks: []
  mirror:
    require_ci: false
    required_status_checks: []
  infra-core:
    require_ci: false
    required_status_checks: []
  standalone:
    require_ci: false
    required_status_checks: []
  shell-tools:
    require_ci: false
    required_status_checks: []
  upstream-sync:
    require_ci: false
    required_status_checks: []
  readme-profile:
    require_ci: false
    required_status_checks: []
  eco:
    require_ci: false
    required_status_checks: []
  # Explicit opt-in profile. Select only after the target repository has a
  # stable aggregate check named exactly "CI Required" on its default branch.
  ci-required:
    require_ci: true
    required_status_checks:
      - "CI Required"

# Explicit opt-outs or non-standard CI names belong here, with a reason and owner.
# Overrides are intentionally per-repository and are not inferred from branch names.
repository_overrides: {}
