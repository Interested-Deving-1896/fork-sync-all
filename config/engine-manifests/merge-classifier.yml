schema_version: 1
id: merge-classifier
name: Provider-neutral change-request merge readiness classifier
lifecycle: active
ownership: fsa
capabilities:
  - classify-change-request-readiness
  - select-history-preserving-merge-strategy
  - fail-closed-on-incomplete-evidence
interfaces:
  - python-module:scripts/merge_strategy_classifier.py
origins:
  mode: original
  references: []
runtime:
  execution_mode: local
  platforms:
    - linux
    - macos
    - windows
  toolchains:
    - python3
io:
  inputs:
    - normalized change-request evidence
    - optional merge policy
  outputs:
    - readiness classification
    - merge strategy recommendation
    - blockers and unknown evidence
security:
  trust: reviewed
  permissions:
    - input-data-read
  secrets: none
  network: none
validation:
  tests:
    - tests/test_merge_strategy_classifier.py
  evidence:
    - workflow:PR Gate
dependencies: []
notes: Pure provider-neutral classifier. It never calls a forge API and never performs a merge.
