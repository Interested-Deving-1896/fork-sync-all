name: Flush Lifecycle Manager

# Coordinates the pre-flush-prep → full-chain-flush pipeline with quota
# reservation and pause/resume at quota reset. Full Chain Flush owns its final
# post-flush verification stage.
#
# Problem this solves:
#   The three-stage flush pipeline can take 2-4 hours. If quota runs out
#   mid-flush, the current stage fails and the pipeline is abandoned.
#   queue-manager and quota-reserve don't know the flush is running and may
#   cancel its queued stages.
#
# What this workflow does:
#   1. RESERVE quota — checks that enough quota exists before starting.
#      Sets FLUSH_ACTIVE=true as a repo variable so queue-manager and
#      quota-reserve treat flush stages as protected (tier 1 equivalent).
#   2. CLEAR queue — cancels all non-CRITICAL queued runs via flush-sentinel.sh
#      to maximise runner availability.
#   3. DISPATCH stages — dispatches pre-flush-prep, waits, then full-chain-flush
#      (including its post-flush verification). Between stages, checks quota.
#   4. PAUSE/RESUME — if quota drops below RESUME_QUOTA between stages, sleeps
#      until the reset window (up to 65 min), then re-checks before continuing.
#   5. RELEASE — clears FLUSH_ACTIVE on completion or failure.
#
# The coordinator deliberately does not start a runner sentinel. It already
# occupies one runner while waiting for dispatched workflows, and an additional
# sleeping job starves those children in a constrained runner pool.
#
# Triggers: weekly schedule or manual dispatch. A standalone Pre-Flush Prep run
# can explicitly dispatch this workflow with skip_pre_flush=true.
#
# Inputs:
#   aggressive_clear — also cancel tier 2 (HIGH) queued runs before flush
#   dry_run          — dispatch stages in dry-run mode (no actual work)
#   skip_pre_flush   — skip pre-flush-prep (use if already run recently)
#   skip_post_flush  — skip post-flush-prep (use for partial flushes)

on:
  # ── Automatic: weekly full flush (Sunday 06:00 UTC, after eco-audit at 05:00)
  schedule:
    - cron: '0 6 * * 0'

  # ── Manual: retained for on-demand use with full input control
  workflow_dispatch:
    inputs:
      aggressive_clear:
        description: "Cancel tier 2 (HIGH) queued runs before flush"
        required: false
        default: "false"
        type: string
      dry_run:
        description: "Dry run — inspect pre-flush state and plan the chain without mutations"
        required: false
        default: "false"
        type: boolean
      skip_pre_flush:
        description: "Skip pre-flush-prep (already run recently)"
        required: false
        default: "false"
        type: boolean
      skip_post_flush:
        description: "Skip post-flush-prep"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: flush-lifecycle
  cancel-in-progress: false # never cancel a running flush lifecycle

env:
  GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
  REPO: ${{ github.repository }}
  # Minimum quota required to START the flush. The full pipeline costs ~800-1200
  # REST calls. We require 1500 headroom so there is buffer for retries.
  START_QUOTA: "1500"
  # Minimum quota required to CONTINUE between stages. Must exceed full-chain-flush's
  # own MIN_QUOTA=2000 pre-flight, plus buffer for runner queue delay (other workflows
  # can drain quota between the checkpoint passing and the runner getting a slot).
  RESUME_QUOTA: "2500"
  # How long to sleep between quota re-checks when paused (seconds).
  PAUSE_POLL_SECONDS: "120"
  # Maximum time to wait for quota reset before giving up (seconds = 65 min).
  MAX_PAUSE_SECONDS: "3900"

jobs:
  # ── Job 1: Lifecycle coordinator ─────────────────────────────────────────────
  lifecycle:
    name: Flush Lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # ratchet:step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: false
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      # ── Normalise schedule and workflow_dispatch inputs ────────────────────
      - name: Resolve trigger inputs
        id: trigger_check
        run: |
          event="${{ github.event_name }}"
          if [[ "$event" == "schedule" ]]; then
            # On schedule: run all stages, no dry-run, no aggressive clear.
            # github.event.inputs is null on schedule — never reference it here.
            echo "Triggered by schedule — running full flush pipeline" >&2
            echo "skip=false"             >> "$GITHUB_OUTPUT"
            echo "skip_pre_flush=false"   >> "$GITHUB_OUTPUT"
            echo "skip_post_flush=false"  >> "$GITHUB_OUTPUT"
            echo "dry_run=false"          >> "$GITHUB_OUTPUT"
            echo "aggressive_clear=false" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch — read inputs directly
            echo "Triggered by ${event}" >&2
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "skip_pre_flush=${{ github.event.inputs.skip_pre_flush || 'false' }}"   >> "$GITHUB_OUTPUT"
            echo "skip_post_flush=${{ github.event.inputs.skip_post_flush || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run || 'false' }}"                 >> "$GITHUB_OUTPUT"
            echo "aggressive_clear=${{ github.event.inputs.aggressive_clear || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Quota pre-flight
        id: quota
        if: steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.dry_run != 'true'
        env:
          MIN_QUOTA: ${{ env.START_QUOTA }}
        run: |
          # Wait up to MAX_PAUSE_SECONDS for quota to recover before giving up.
          # This handles the common case where the flush is dispatched right after
          # a quota-heavy operation (ratchet, push-triggered CI, etc.).
          elapsed=0
          while true; do
            remaining=$(curl -sf \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/rate_limit" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['resources']['core']['remaining'])" \
              2>/dev/null || echo "0")
            reset_at=$(curl -sf \
              -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/rate_limit" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['resources']['core']['reset'])" \
              2>/dev/null || echo "0")

            if [[ "${remaining}" -ge "${START_QUOTA}" ]]; then
              echo "Quota OK: ${remaining} remaining (need ${START_QUOTA})" >&2
              echo "remaining=${remaining}" >> "$GITHUB_OUTPUT"
              break
            fi

            now=$(date +%s)
            wait_seconds=$(( reset_at - now + 30 ))
            echo "Quota too low: ${remaining} < ${START_QUOTA}. Reset in ~${wait_seconds}s — pausing." >&2

            if [[ ${elapsed} -ge ${MAX_PAUSE_SECONDS} ]]; then
              echo "Waited ${elapsed}s — giving up. Re-dispatch after quota reset." >&2
              exit 1
            fi

            sleep_time=$(( wait_seconds > 0 && wait_seconds < PAUSE_POLL_SECONDS ? wait_seconds + 30 : PAUSE_POLL_SECONDS ))
            sleep "${sleep_time}"
            elapsed=$(( elapsed + sleep_time ))
          done

      # ── Mark flush as active (protects stages from queue-manager/quota-reserve)
      - name: Set FLUSH_ACTIVE
        if: steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.dry_run != 'true'
        run: |
          source scripts/includes/pipeline-guard.sh
          pipeline_guard_start "Flush Lifecycle"

      # ── Clear queue to free runner slots ──────────────────────────────────
      - name: Clear queue (flush-sentinel)
        if: steps.trigger_check.outputs.skip != 'true'
        env:
          AGGRESSIVE_CLEAR: ${{ steps.trigger_check.outputs.aggressive_clear }}
          DRY_RUN: ${{ steps.trigger_check.outputs.dry_run }}
        run: bash scripts/flush-sentinel.sh clear

      # ── Stage 1: pre-flush-prep ───────────────────────────────────────────
      - name: "Stage 1: pre-flush-prep"
        if: steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.skip_pre_flush != 'true'
        env:
          DRY_RUN: ${{ steps.trigger_check.outputs.dry_run }}
        run: |
          # Brief settle delay: after flush-sentinel clears the queue (which
          # can take minutes when quota is low), GitHub re-indexes the ref.
          # Dispatching immediately after a long sentinel run risks HTTP 400
          # ("ref not found") during the indexing window. 15s is enough for
          # the indexing to complete in practice.
          sleep 15

          # Pass quota_wait_min=65 so pre-flush-prep waits for quota reset
          # rather than immediately exiting 1 when quota is low on startup.
          # Also retry up to 3 times to handle transient quota exhaustion
          # between flush-lifecycle's pre-flight passing and pre-flush-prep
          # getting a runner slot (other queued workflows consume quota first).
          _attempt=0
          while true; do
            (( _attempt++ )) || true
            _pfp_inputs=$(python3 -c "import json,os; print(json.dumps({'dry_run':os.environ['DRY_RUN'],'quota_wait_min':'65','continue_pipeline':'false'},separators=(',',':')))")
            if bash scripts/dispatch-and-wait.sh pre-flush-prep.yml 150 "${_pfp_inputs}"; then
              rc=0
            else
              rc=$?
            fi
            if [[ $rc -eq 0 ]]; then
              break
            elif [[ $rc -eq 2 ]]; then
              echo "pre-flush-prep cancelled (attempt ${_attempt}) — retrying in 30s..." >&2
              sleep 30
              [[ $_attempt -ge 3 ]] && { echo "pre-flush-prep cancelled 3 times — aborting" >&2; exit 1; }
            else
              echo "pre-flush-prep failed (attempt ${_attempt}, exit ${rc})" >&2
              [[ $_attempt -ge 3 ]] && exit $rc
              echo "Retrying in 60s..." >&2
              sleep 60
            fi
          done

      # ── Quota checkpoint before full-chain-flush ──────────────────────────
      - name: Quota checkpoint (pre-flush → flush)
        id: checkpoint_1
        if: steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.dry_run != 'true'
        run: |
          source scripts/includes/gh-api.sh
          remaining=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/rate_limit" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['resources']['core']['remaining'])" \
            2>/dev/null || echo "0")
          reset_at=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/rate_limit" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['resources']['core']['reset'])" \
            2>/dev/null || echo "0")
          echo "remaining=${remaining}" >> "$GITHUB_OUTPUT"
          echo "reset_at=${reset_at}" >> "$GITHUB_OUTPUT"
          echo "Quota before full-chain-flush: ${remaining}" >&2

          if [[ "${remaining}" -lt "${RESUME_QUOTA}" ]]; then
            echo "pause_needed=true" >> "$GITHUB_OUTPUT"
            echo "Quota low (${remaining} < ${RESUME_QUOTA}) — will pause before full-chain-flush" >&2
          else
            echo "pause_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pause until quota reset (checkpoint 1)
        if: steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.dry_run != 'true' && steps.checkpoint_1.outputs.pause_needed == 'true'
        env:
          RESET_AT: ${{ steps.checkpoint_1.outputs.reset_at }}
        run: |
          now=$(date +%s)
          reset_at="${RESET_AT}"
          wait_seconds=$(( reset_at - now + 30 ))  # +30s buffer after reset

          if [[ ${wait_seconds} -le 0 ]]; then
            echo "Reset already passed — continuing immediately" >&2
          elif [[ ${wait_seconds} -gt ${MAX_PAUSE_SECONDS} ]]; then
            echo "Wait time ${wait_seconds}s exceeds MAX_PAUSE_SECONDS ${MAX_PAUSE_SECONDS}s — aborting" >&2
            exit 1
          else
            echo "Pausing ${wait_seconds}s until quota reset at $(date -d @${reset_at} -u 2>/dev/null || date -r ${reset_at} -u 2>/dev/null || echo ${reset_at})" >&2
            elapsed=0
            while [[ ${elapsed} -lt ${wait_seconds} ]]; do
              sleep "${PAUSE_POLL_SECONDS}"
              elapsed=$(( elapsed + PAUSE_POLL_SECONDS ))
              remaining=$(curl -sf \
                -H "Authorization: token ${GH_TOKEN}" \
                "https://api.github.com/rate_limit" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['resources']['core']['remaining'])" \
                2>/dev/null || echo "0")
              echo "  [${elapsed}s] Quota: ${remaining}" >&2
              if [[ "${remaining}" -ge "${RESUME_QUOTA}" ]]; then
                echo "Quota restored (${remaining}) — resuming" >&2
                break
              fi
            done
          fi

      # ── Stage 2: full-chain-flush ─────────────────────────────────────────
      - name: "Stage 2: full-chain-flush"
        if: steps.trigger_check.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ steps.trigger_check.outputs.dry_run }}
          SKIP_POST_FLUSH: ${{ steps.trigger_check.outputs.skip_post_flush }}
        run: |
          _fcf_inputs=$(python3 -c "import json,os; print(json.dumps({'dry_run':os.environ['DRY_RUN'],'managed_by_lifecycle':'true','skip_post_flush':os.environ['SKIP_POST_FLUSH']},separators=(',',':')))")
          # Full Chain Flush has a 300-minute job timeout; allow an additional
          # 30 minutes for runner pickup and completion reporting.
          if bash scripts/dispatch-and-wait.sh full-chain-flush.yml 330 "${_fcf_inputs}"; then
            rc=0
          else
            rc=$?
          fi
          if [[ $rc -eq 2 ]]; then
            echo "full-chain-flush cancelled — retrying once after 60s" >&2
            sleep 60
            if bash scripts/dispatch-and-wait.sh full-chain-flush.yml 330 "${_fcf_inputs}"; then
              rc=0
            else
              rc=$?
            fi
          fi
          exit "$rc"

      # ── Release FLUSH_ACTIVE (always runs, even on failure) ───────────────
      - name: Clear FLUSH_ACTIVE
        if: always() && steps.trigger_check.outputs.skip != 'true' && steps.trigger_check.outputs.dry_run != 'true'
        run: |
          source scripts/includes/pipeline-guard.sh
          pipeline_guard_end "Flush Lifecycle"
