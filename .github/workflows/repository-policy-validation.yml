name: Repository Policy Validation

on:
  pull_request:
    paths:
      - "config/repository-policy-baseline.yml"
      - "config/template-consumers.yml"
      - "scripts/repository_policy.py"
      - "scripts/manage-repo-settings.sh"
      - "scripts/onboard-repo.sh"
      - "scripts/validate-workflows.sh"
      - "tests/test_repository_policy.py"
      - ".github/workflows/repository-policy-validation.yml"
  push:
    branches: [main]
    paths:
      - "config/repository-policy-baseline.yml"
      - "config/template-consumers.yml"
      - "scripts/repository_policy.py"
      - "tests/test_repository_policy.py"
      - ".github/workflows/repository-policy-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Run policy resolver tests
        run: python -m unittest tests.test_repository_policy -v
      - name: Syntax-check policy integrations
        run: bash -n scripts/manage-repo-settings.sh scripts/onboard-repo.sh scripts/validate-workflows.sh
      - name: Verify workflow allowlist
        run: bash scripts/validate-workflows.sh
      - name: Resolve registered consumers
        run: |
          python - <<'PY'
          import json, subprocess, yaml
          consumers = yaml.safe_load(open("config/template-consumers.yml"))["consumers"]
          for entry in consumers:
              if not isinstance(entry, dict) or entry.get("disabled"):
                  continue
              name = entry["name"]
              result = subprocess.run(
                  ["python3", "scripts/repository_policy.py", "--repo", name],
                  check=True, text=True, capture_output=True,
              )
              data = json.loads(result.stdout)
              if data.get("status") == "resolved":
                  print(f"{name}: {data['profile']} (require_ci={data['require_ci']})")
          PY
