name: BDFS Dev — BTRFS Backend

# Creates a writable BTRFS snapshot of a source path as a bdfs dev workspace.
# The source must be a BTRFS subvolume or a directory on a BTRFS filesystem.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source BTRFS subvolume or directory path'
        type: string
        required: true
      workspace:
        description: 'Workspace name (default: auto-generated)'
        type: string
        default: ''
      dry_run:
        description: 'Report what would be created — do not snapshot'
        type: boolean
        default: false

concurrency:
  group: bdfs-dev-btrfs-${{ inputs.workspace || 'default' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev-btrfs:
    runs-on: bdfs-native
    environment: bdfs-native
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Run BTRFS workspace wrapper
        env:
          BDFS_SOURCE: ${{ inputs.source }}
          BDFS_WORKSPACE: ${{ inputs.workspace || '' }}
          BDFS_ALLOWED_ROOTS: ${{ vars.BDFS_ALLOWED_ROOTS || '/srv/bdfs:/var/lib/bdfs:/ostree' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(create --source "$BDFS_SOURCE" --backend btrfs)
          [[ -n "$BDFS_WORKSPACE" ]] && args+=(--name "$BDFS_WORKSPACE")
          if [[ "$DRY_RUN" == "true" ]]; then
            bash scripts/bdfs-dev.sh "${args[@]}"
          else
            sudo -n env BDFS_ALLOWED_ROOTS="$BDFS_ALLOWED_ROOTS" \
              BDFS_STATE_DIR=/var/lib/bdfs/dev DRY_RUN=false \
              bash scripts/bdfs-dev.sh "${args[@]}"
          fi

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
