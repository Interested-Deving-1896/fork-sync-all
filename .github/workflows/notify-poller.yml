name: Notification Poller

# Polls the GitHub notifications API every four hours for unread CI activity.
# When any is found, triggers resolve-failures.yml rather than waiting for its
# daily 07:30 UTC schedule. The resolver decides whether failures are actionable.
#
# Requires checkout for scripts/includes/quota-snapshot.sh (sources
# time_format.py via a path relative to the script file). All the actual
# fix logic lives in resolve-failures.
#
# Concurrency: if a resolve-failures run is already in progress (cancel-in-
# progress: false), the triggered run will queue behind it automatically.
# Schedule reduced from every 2h to every 4h to reduce REST quota consumption.

on:
  schedule:
    - cron: '32 */4 * * *' # Every 4h — staggered from mirror-osp-to-gitlab :30
  workflow_dispatch: {}

permissions:
  actions: write # Needed to trigger workflow_dispatch on resolve-failures.yml
  contents: read

# ── Rate limits ──────────────────────────────────────────────────────────────
# One notifications API call every four hours; a matching ETag returns 304 and
# does not consume primary REST quota. Authentication and HTTP failures fail the
# run visibly instead of being treated as an empty inbox.

concurrency:
  group: notify-poller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Quota pre-flight
        id: quota
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MIN_QUOTA: "50"
        run: |
          source scripts/includes/quota-snapshot.sh
          quota_snapshot

      - name: Check FSA mode
        id: fsa
        if: steps.quota.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FSA_MANAGED: ${{ vars.FSA_MANAGED }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          source scripts/includes/fsa-node-identity.sh
          fsa_node_detect
          if [[ "$FSA_NODE_POSITION" == "mirror" ]]; then
            echo "managed=true" >> "$GITHUB_OUTPUT"
            echo "Mirror node — notification polling is handled by the source control plane."
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
            echo "${FSA_NODE_POSITION} node — notification polling is active."
          fi

      - name: Restore ETag cache
        if: steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false'
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # ratchet:actions/cache@v6
        with:
          path: ~/.cache/notify-poller
          key: notify-poller-etag-v2-${{ github.run_id }}
          restore-keys: notify-poller-etag-v2-

      - name: Check for unread CI activity notifications
        if: steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false'
        id: check
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # ETag caching: a 304 Not Modified response costs 0 against the
          # rate limit. We persist the ETag from the previous poll in the
          # Actions cache and send If-None-Match on subsequent requests.
          # On 304, notifications haven't changed — skip the resolver trigger.
          CACHE_DIR="${HOME}/.cache/notify-poller"
          ETAG_FILE="${CACHE_DIR}/notifications.etag"
          BODY_FILE="/tmp/notify-poller.json"
          HEADERS_FILE="${CACHE_DIR}/response-headers.txt"
          mkdir -p "$CACHE_DIR"

          curl_args=(
            -sS
            -o "$BODY_FILE"
            -D "$HEADERS_FILE"
            -w "%{http_code}"
            -H "Authorization: token ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          if [[ -f "$ETAG_FILE" ]]; then
            stored_etag=$(cat "$ETAG_FILE")
            [[ -n "$stored_etag" ]] && curl_args+=(-H "If-None-Match: ${stored_etag}")
          fi

          if ! http_code=$(curl "${curl_args[@]}" \
            "https://api.github.com/notifications?all=false&per_page=50"); then
            echo "::error::Notifications API request failed before an HTTP response was received."
            exit 1
          fi

          # 304 Not Modified — no new notifications since last poll, 0 rate cost
          if [[ "$http_code" == "304" ]]; then
            echo "304 Not Modified — notifications unchanged since last poll (0 rate cost)"
            printf '[]\n' > "$BODY_FILE"
            printf 'ci_activity_count=0\n' >> "$GITHUB_OUTPUT"
            printf 'notif_file=%s\n' "$BODY_FILE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$http_code" != "200" ]]; then
            message=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('message','unknown error'))" "$BODY_FILE" 2>/dev/null || echo "unknown error")
            echo "::error::Notifications API returned HTTP ${http_code}: ${message}"
            exit 1
          fi

          if ! python3 -c "import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data,list)" "$BODY_FILE"; then
            echo "::error::Notifications API returned an invalid response body."
            exit 1
          fi

          # Persist the new ETag for the next poll
          new_etag=$(grep -i '^etag:' "$HEADERS_FILE" 2>/dev/null \
            | tr -d '\r' | awk '{print $2}')
          [[ -n "$new_etag" ]] && printf '%s' "$new_etag" > "$ETAG_FILE"

          count=$(python3 -c "import json,sys; print(sum(n.get('reason') == 'ci_activity' for n in json.load(open(sys.argv[1]))))" "$BODY_FILE")

          printf 'ci_activity_count=%s\n' "${count}" >> "$GITHUB_OUTPUT"
          echo "Unread CI activity notifications: ${count}"
          printf 'notif_file=%s\n' "$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Save ETag cache
        if: always() && steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # ratchet:actions/cache/save@v6
        with:
          path: ~/.cache/notify-poller
          key: notify-poller-etag-v2-${{ github.run_id }}

      - name: Trigger resolver if CI activity is found
        if: steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false' && steps.check.outputs.ci_activity_count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          echo "Found ${{ steps.check.outputs.ci_activity_count }} CI notification(s) — triggering resolver..."
          curl -sSf \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/resolve-failures.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Resolver triggered."

      - name: Check SYNC_TOKEN expiry
        if: steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # Reuse the authenticated notifications response headers so this
          # expiry check costs no additional API request.
          expiry=$(grep -iE "^(github-authentication-token-expiration|x-oauth-token-expiration):" \
            "${HOME}/.cache/notify-poller/response-headers.txt" 2>/dev/null \
            | head -1 \
            | sed 's/.*: //' | tr -d '\r')

          if [[ -z "$expiry" ]]; then
            echo "SYNC_TOKEN: no expiry header (classic PAT with no expiry, or token type does not expose expiry)"
            exit 0
          fi

          expiry_epoch=$(date -d "$expiry" +%s 2>/dev/null || echo 0)
          now_epoch=$(date +%s)
          days_left=$(( (expiry_epoch - now_epoch) / 86400 ))

          echo "SYNC_TOKEN expires: ${expiry} (${days_left} day(s) remaining)"

          if [[ "$days_left" -lt 0 ]]; then
            echo "::error::SYNC_TOKEN has expired — workflows will fail immediately. Rotate it now."
            exit 1
          elif [[ "$days_left" -le 2 ]]; then
            echo "::warning::SYNC_TOKEN expires in ${days_left} day(s). Rotate before it expires."
            # Trigger token-health workflow for a full report
            curl -sf \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/token-health.yml/dispatches" \
              -d '{"ref":"main"}' \
              && echo "Token health workflow triggered for full report." \
              || echo "Could not trigger token-health workflow."
          fi
