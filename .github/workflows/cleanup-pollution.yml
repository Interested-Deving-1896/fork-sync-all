name: Cleanup Template Pollution

# Reports candidate paths in enabled, managed GitHub consumers from
# config/template-consumers.yml. Path presence is not ownership evidence.
# Protected, delegated, and disabled consumers are skipped.
# GitLab is skipped until the registry has explicit provider-qualified targets.
#
# The workflow and script are report-only; no delete operation is available.
#
# Triggers:
#   workflow_dispatch — manual: defaults dry_run=true for safety.
#   workflow_run      — automatic: fires after Sync Template completes, since
#                       template syncs are the primary source of pollution.
#                       Runs with dry_run=true so results appear in the summary
#                       for review without deleting anything automatically.
#                       The script has no live-deletion mode; dry_run=false fails closed.
#
# Requires:
#   SYNC_TOKEN    — GitHub PAT with read access to registered consumer repos

on:
  workflow_run:
    workflows:
      - "Sync Template"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; this workflow has no live-deletion mode"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-pollution
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Report candidate paths in registered consumer repos
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # workflow_run: always dry_run — auto-runs report only, never delete
          DRY_RUN: ${{ github.event_name == 'workflow_run' && 'true' || inputs.dry_run }}
          BUDGET_MINUTES: "55"
        run: bash scripts/cleanup-pollution.sh

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
