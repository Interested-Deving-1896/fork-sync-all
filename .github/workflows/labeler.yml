name: "PR Labeler"

on:
  - pull_request_target

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # ratchet:actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
