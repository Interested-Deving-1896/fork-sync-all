name: Upstream Engine report

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "Optional comma-separated explicit OWNER/NAME repositories"
        required: false
        type: string
      organizations:
        description: "GitHub organizations for public, read-only discovery"
        required: false
        type: string
        default: "akamai-developers,linode"
      categories:
        description: "Optional comma-separated categories: edge,kubernetes,iac,sdk-cli,ai,docs-samples,other"
        required: false
        type: string
      format:
        description: "Report format"
        required: true
        type: choice
        options:
          - json
          - markdown
        default: json

permissions:
  contents: read

concurrency:
  group: upstream-engine-report
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only upstream inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Generate read-only report
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIES: ${{ inputs.repositories }}
          ORGANIZATIONS: ${{ inputs.organizations }}
          CATEGORIES: ${{ inputs.categories }}
          REPORT_FORMAT: ${{ inputs.format }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def values(name):
              return [item.strip() for item in os.environ.get(name, "").split(",") if item.strip()]

          repositories = values("REPOSITORIES")
          organizations = values("ORGANIZATIONS")
          categories = values("CATEGORIES")
          if not repositories and not organizations:
              raise SystemExit("Provide at least one explicit repository or organization")
          for repository in repositories:
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  raise SystemExit(f"Invalid OWNER/NAME repository: {repository!r}")
          for organization in organizations:
              if not re.fullmatch(r"[A-Za-z0-9-]{1,39}", organization):
                  raise SystemExit(f"Invalid organization name: {organization!r}")
          allowed = {"edge", "kubernetes", "iac", "sdk-cli", "ai", "docs-samples", "other"}
          for category in categories:
              if category not in allowed:
                  raise SystemExit(f"Invalid category: {category!r}")

          args = [sys.executable, "scripts/upstream_engine.py"]
          for repository in repositories:
              args.extend(["--repo", repository])
          for organization in organizations:
              args.extend(["--org", organization])
          for category in categories:
              args.extend(["--category", category])
          args.extend(["--format", os.environ["REPORT_FORMAT"], "--output",
                       "upstream-engine-report." + os.environ["REPORT_FORMAT"]])
          subprocess.run(args, check=True)
          PY

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-engine-report
          path: upstream-engine-report.*
          if-no-files-found: error
          retention-days: 14
