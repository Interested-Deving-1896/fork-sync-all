name: Project Creation Engine Tests

on:
  pull_request:
    paths:
      - "scripts/project_creation_engine.py"
      - "tests/test_project_creation_engine.py"
      - "scripts/project_template_registry.py"
      - "tests/test_project_template_registry.py"
      - "scripts/project_template_bundle.py"
      - "tests/test_project_template_bundle.py"
      - "templates/project-creation/**"
      - "config/project-template-registry.yml"
      - ".github/workflows/project-creation-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-creation-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-creation-engine-unit-tests:
    name: Project creation engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
          disable-sudo: true
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run registry resolver tests
        run: python3 -m unittest discover -s tests -p "test_project_template_registry.py" -v
      - name: Run local template bundle tests
        run: python3 -m unittest discover -s tests -p "test_project_template_bundle.py" -v
      - name: Run engine tests
        run: python3 -m unittest discover -s tests -p "test_project_creation_engine.py" -v
