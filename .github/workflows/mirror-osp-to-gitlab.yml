name: Mirror OSP → GitLab

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only inspection (workflow is paused)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  safety-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Report development hold
        run: |
          echo "::notice::OSP to GitLab mirror is paused pending branch-protection and safe-update review."
          echo "::notice::No GitLab projects, protected branches, refs, or credentials were changed."
