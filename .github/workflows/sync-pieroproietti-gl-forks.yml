name: Sync Pieroproietti GitLab Forks

# Mirrors the legacy and modern implementations to their existing GitLab
# destinations using their current canonical upstream repository identities.
#
# Legacy: pieroproietti/penguins-eggs-legacy:master -> project 81413430
# Modern: pieroproietti/penguins-eggs:main          -> project 81412997
# penguins-eggs-book remains a read-only historical snapshot and is not synced.

on:
  schedule:
    - cron: '15 2 * * *' # Daily 02:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report refs and releases without pushing or creating releases'
        type: boolean
        default: false
      rate_limit_rerun:
        description: 'Set by rate-limit-rerun — prevents re-trigger loops'
        type: string
        default: 'false'

concurrency:
  group: sync-pieroproietti-gl-forks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: inputs.rate_limit_rerun != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Sync legacy and modern Penguins-Eggs generations
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          BUDGET_MINUTES: "55"
        run: bash scripts/sync-pieroproietti-gl-forks.sh

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
