name: Workflow Dispatch Engine Tests

on:
  pull_request:
    paths:
      - "scripts/workflow_dispatch_engine.py"
      - "tests/test_workflow_dispatch_engine.py"
      - "config/workflow-dispatch-policy.json"
      - ".github/workflows/workflow-dispatch-engine-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/workflow_dispatch_engine.py"
      - "tests/test_workflow_dispatch_engine.py"
      - "config/workflow-dispatch-policy.json"
      - ".github/workflows/workflow-dispatch-engine-tests.yml"

permissions:
  contents: read

concurrency:
  group: workflow-dispatch-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Policy and adapter contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run workflow dispatch engine tests
        run: python3 -m unittest discover -s tests -p "test_workflow_dispatch_engine.py" -v
      - name: Validate policy JSON
        run: python3 -m json.tool config/workflow-dispatch-policy.json >/dev/null
