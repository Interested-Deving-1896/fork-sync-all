name: README Subsystem

on:
  pull_request:
    paths:
      - 'README.md'
      - 'DOCS/readme-subsystem.md'
      - 'config/readme-policy.json'
      - 'config/readme-subsystem.json'
      - 'config/readme-subsystem.lock.json'
      - 'readme-subsystem/**'
      - 'schema/readme-subsystem.schema.json'
      - 'scripts/readme-subsystem.py'
      - 'scripts/readme_policy.py'
      - 'scripts/check_rendered_links.py'
      - 'tests/fixtures/readme-subsystem/**'
      - 'tests/test_readme_subsystem.py'
      - '.github/workflows/readme-subsystem.yml'
  push:
    branches: [main]
    paths:
      - 'DOCS/readme-subsystem.md'
      - 'config/readme-policy.json'
      - 'config/readme-subsystem.json'
      - 'config/readme-subsystem.lock.json'
      - 'readme-subsystem/**'
      - 'schema/readme-subsystem.schema.json'
      - 'scripts/readme-subsystem.py'
      - 'scripts/readme_policy.py'
      - 'scripts/check_rendered_links.py'
      - 'tests/fixtures/readme-subsystem/**'
      - 'tests/test_readme_subsystem.py'
      - '.github/workflows/readme-subsystem.yml'
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Check drift or open a reconciliation pull request
        required: true
        default: check
        type: choice
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: readme-subsystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate subsystem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate contract and provenance
        run: |
          python3 scripts/readme-subsystem.py validate
          python3 scripts/readme-subsystem.py lock --check

      - name: Run subsystem tests
        run: python3 -m unittest discover -s tests -p 'test_readme_subsystem.py'

      - name: Run canonical README checks
        uses: ./readme-subsystem
        with:
          readme: README.md
          policy: config/readme-policy.json
          report: readme-report.json

      - name: Render responsive README preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p readme-preview
          jq -Rs --arg context "$REPOSITORY" \
            '{text: ., mode: "gfm", context: $context}' README.md \
            > "$RUNNER_TEMP/markdown-request.json"
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/markdown \
            --data-binary @"$RUNNER_TEMP/markdown-request.json" \
            > readme-preview/fragment.html
          python3 - <<'PREVIEW_PY'
          from pathlib import Path
          fragment = Path("readme-preview/fragment.html").read_text(encoding="utf-8")
          page = """<!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>README preview</title><style>
          body{margin:0;font:16px/1.55 system-ui,sans-serif}main{box-sizing:border-box;
          max-width:1012px;margin:auto;padding:32px;overflow-wrap:anywhere}
          img{max-width:100%;height:auto}pre,table{max-width:100%;overflow:auto}
          @media(max-width:480px){main{padding:16px}}
          </style></head><body><main>""" + fragment + "</main></body></html>"
          Path("readme-preview/index.html").write_text(page, encoding="utf-8")
          PREVIEW_PY

      - name: Upload policy and preview artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-subsystem-${{ github.run_id }}
          path: |
            readme-report.json
            readme-preview/
          retention-days: 14
          if-no-files-found: warn

  cross-port:
    name: Cross-port canonical engines by pull request
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Fork-Sync-All
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Select reconciliation mode and credential
        id: settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'check' }}
          APP_ID: ${{ vars.README_SUBSYSTEM_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.README_SUBSYSTEM_APP_PRIVATE_KEY }}
          LEGACY_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          mode="$REQUESTED_MODE"
          [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" ]] && mode=apply
          credential=none
          [[ -n "$LEGACY_TOKEN" ]] && credential=legacy
          [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]] && credential=app
          if [[ "$mode" == "apply" && "$credential" == "none" ]]; then
            echo "::error::Configure the README Subsystem GitHub App or SYNC_TOKEN."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "credential=$credential" >> "$GITHUB_OUTPUT"

      - name: Mint least-privilege GitHub App token
        id: app-token
        if: steps.settings.outputs.credential == 'app'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.README_SUBSYSTEM_APP_ID }}
          private-key: ${{ secrets.README_SUBSYSTEM_APP_PRIVATE_KEY }}
          owner: Interested-Deving-1896
          repositories: Interested-Deving-1896
          permission-contents: write
          permission-pull-requests: write

      - name: Configure cross-project authentication
        if: steps.settings.outputs.mode == 'apply'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          LEGACY_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          token="${APP_TOKEN:-$LEGACY_TOKEN}"
          echo "::add-mask::$token"
          GH_TOKEN="$token" gh auth setup-git

      - name: Clone profile source
        run: >-
          git clone --depth 1
          https://github.com/Interested-Deving-1896/Interested-Deving-1896.git
          "$RUNNER_TEMP/profile-source"

      - name: Check or apply canonical artifacts
        env:
          MODE: ${{ steps.settings.outputs.mode }}
          TARGET_ROOT: ${{ runner.temp }}/profile-source
        run: |
          args=(sync --target interested-deving-1896 --target-root "$TARGET_ROOT")
          [[ "$MODE" == "check" ]] && args+=(--check)
          python3 scripts/readme-subsystem.py "${args[@]}"

      - name: Open or update reconciliation pull request
        if: steps.settings.outputs.mode == 'apply'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          LEGACY_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_ROOT: ${{ runner.temp }}/profile-source
          CANONICAL_SHA: ${{ github.sha }}
        run: |
          cd "$TARGET_ROOT"
          export GH_TOKEN="${APP_TOKEN:-$LEGACY_TOKEN}"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Profile source already contains the canonical subsystem."
            exit 0
          fi
          branch="automation/readme-subsystem-${CANONICAL_SHA:0:12}"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -c "$branch"
          git config user.name "fork-sync-all[bot]"
          git config user.email "fork-sync-all[bot]@users.noreply.github.com"
          git add DOCS/readme-subsystem.md config/readme-subsystem.json \
            config/readme-subsystem.lock.json schema/readme-subsystem.schema.json \
            readme-subsystem/VERSION readme-subsystem/CHANGELOG.md \
            scripts/readme-subsystem.py scripts/readme_policy.py \
            scripts/check_rendered_links.py
          git commit -m "chore(readme): sync canonical README subsystem"
          git push origin "HEAD:refs/heads/$branch" --force-with-lease
          existing="$(gh pr list --repo Interested-Deving-1896/Interested-Deving-1896 \
            --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "Updated $existing"
          else
            gh pr create --repo Interested-Deving-1896/Interested-Deving-1896 \
              --base main --head "$branch" \
              --title "chore(readme): sync canonical README subsystem" \
              --body "Promotes the reviewed README subsystem release from Fork-Sync-All at \`$CANONICAL_SHA\`. No profile-owned content is changed."
          fi
