name: Vouch Sync Codeowners

# Weekly: regenerates VOUCHED.td from the vouch registry, its single source of
# truth. Opens or refreshes one stable PR if the generated file changed.

on:
  schedule:
    - cron: '23 4 * * 1' # Weekly on Mondays at 04:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without opening a PR'
        required: false
        default: false
        type: boolean

concurrency:
  group: vouch-sync-codeowners
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Codeowners → VOUCHED.td
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync registry → VOUCHED.td
        env:
          REGISTRY_FILE: config/vouch-registry.yml
          VOUCHED_FILE: .github/VOUCHED.td
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          source scripts/vouch-registry.sh
          registry_sync_vouched_td "$VOUCHED_FILE"

      - name: Validate generated trust state
        if: inputs.dry_run != 'true'
        run: |
          if ! grep -q '^github:Interested-Deving-1896\([[:space:]]\|$\)' .github/VOUCHED.td; then
            echo "::error::Generated VOUCHED.td dropped the Tier 1 maintainer; refusing to continue."
            exit 1
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .github/VOUCHED.td; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff .github/VOUCHED.td
          fi

      - name: Open PR with changes
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          branch="vouch/sync-codeowners"
          git config user.name "vouch-bot"
          git config user.email "vouch@fork-sync-all"
          git checkout -B "$branch"
          git add .github/VOUCHED.td
          git commit -m $'chore(vouch): sync registry into VOUCHED.td [skip ci]\n\nAuto-generated by vouch-sync-codeowners.yml.'
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')
          if [[ -n "$existing" ]]; then
            echo "Updated existing Vouch sync PR: ${existing}"
          else
            gh pr create \
              --title "chore(vouch): sync registry into VOUCHED.td" \
              --base main \
              --head "$branch" \
              --body $'Regenerates `.github/VOUCHED.td` from `config/vouch-registry.yml`, the trust registry single source of truth.\n\nAuto-generated by `vouch-sync-codeowners.yml`.'
          fi
