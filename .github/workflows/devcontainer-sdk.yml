name: Devcontainer SDK

# Treats the devcontainer as a first-class API/SDK surface:
#
#   validate  — Verify devcontainer.json, all features, and automations
#               templates are well-formed and internally consistent.
#               Runs automatically on push to .devcontainer/.
#
#   build     — Build, smoke-test, and push the devcontainer image to GHCR as
#               a reusable OCI artifact. Runs automatically for relevant
#               pushes; downstream workflows can pull the resulting image.
#
#   publish   — Publish devcontainer features from .devcontainer/features/
#               to GHCR as OCI artifacts so consumers can reference them
#               by URI (ghcr.io/ORG/REPO/FEATURE:VERSION).
#
# The devcontainer image acts as an SDK: it bundles all platform CLIs
# (gh, glab, tea), Python tooling, and fork-sync-all scripts into a
# single reproducible environment any workflow or developer can pull.

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-sdk.yml
      - scripts/codex-cloud-install.sh
      - scripts/devcontainer-*.py
      - scripts/devcontainer-*.sh

  workflow_dispatch:
    inputs:
      mode:
        description: 'Operation mode'
        required: true
        type: choice
        options: [validate, build, publish]
        default: validate
      dry_run:
        description: 'Log actions without pushing images or features'
        required: false
        type: boolean
        default: false

concurrency:
  group: devcontainer-sdk-${{ inputs.mode || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quota:
    name: Quota pre-flight
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
      - name: Check quota
        id: check
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          source scripts/includes/budget.sh
          source scripts/includes/quota-snapshot.sh
          MIN_QUOTA=$(workflow_min_quota "Devcontainer SDK")
          export MIN_QUOTA
          quota_snapshot

  validate:
    name: Validate devcontainer
    runs-on: ubuntu-latest
    needs: quota
    if: needs.quota.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Validate devcontainer setup
        run: python3 scripts/devcontainer-validate.py

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: '{"mode":"validate"}'
        run: bash scripts/write-summary.sh

  build:
    name: Build and smoke-test devcontainer image
    runs-on: ubuntu-latest
    needs: [quota, validate]
    if: >-
      needs.quota.outputs.skip == 'false' &&
      (github.event_name == 'push' || inputs.mode == 'build')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Log in to GHCR
        if: inputs.dry_run != true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # ratchet:docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and publish devcontainer
        id: build_image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # ratchet:devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/interested-deving-1896/fork-sync-all/devcontainer
          imageTag: latest,${{ github.sha }}
          cacheFrom: ghcr.io/interested-deving-1896/fork-sync-all/devcontainer:latest
          push: ${{ inputs.dry_run == true && 'never' || 'always' }}
          runCmd: |
            set -euo pipefail
            command -v bash python3 git curl jq go cargo gh glab tea
            python3 -m venv /tmp/fsa-runner-venv
            /tmp/fsa-runner-venv/bin/python -m pip install --quiet 'PyYAML>=6,<7'
            /tmp/fsa-runner-venv/bin/python scripts/devcontainer-validate.py

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh

  publish-features:
    name: Publish devcontainer features to GHCR
    runs-on: ubuntu-latest
    needs: [quota, validate]
    if: needs.quota.outputs.skip == 'false' && inputs.mode == 'publish'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # ratchet:docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli --quiet 2>/dev/null || true

      - name: Publish features
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPO: ${{ github.repository }}
        run: bash scripts/devcontainer-publish-features.sh

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
