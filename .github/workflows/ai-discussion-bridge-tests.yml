name: AI Discussion Bridge Core Tests

on:
  pull_request:
    paths:
      - "scripts/ai-discussion-bridge/**"
      - ".github/workflows/ai-discussion-bridge-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ai-discussion-bridge/**"
      - ".github/workflows/ai-discussion-bridge-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate sample export
        run: python scripts/ai-discussion-bridge/bridge.py validate scripts/ai-discussion-bridge/examples/gemini-conversation.json
      - name: Run unit tests
        run: python -m unittest discover -s scripts/ai-discussion-bridge/tests -v
      - name: Render sample Markdown
        run: python scripts/ai-discussion-bridge/bridge.py render scripts/ai-discussion-bridge/examples/gemini-conversation.json --output "$RUNNER_TEMP/sample.md"
