name: Setup OSP Mirror Workflows

# Development hold: this workflow is intentionally non-operational.
# The mirror writer inventory and safe replacement are tracked in #1038.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Report development hold
        run: |
          echo "::notice::Mirror setup/provisioning paused; this workflow cannot enable downstream writers or reconcile refs."
          echo "::notice::No repositories, refs, credentials, or downstream workflows were changed."
