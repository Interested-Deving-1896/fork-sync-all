name: Origins archaeology integration tests

on:
  pull_request:
    paths:
      - "scripts/origins_archaeology.py"
      - "scripts/code_archaeology_evidence.py"
      - "schemas/origins-archaeology-evidence.schema.json"
      - "tests/test_origins_archaeology.py"

permissions:
  contents: read

concurrency:
  group: origins-archaeology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-e2e:
    name: Offline bidirectional evidence contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Run offline integration tests
        run: python3 -m unittest discover -s tests -p 'test_origins_archaeology.py' -v
