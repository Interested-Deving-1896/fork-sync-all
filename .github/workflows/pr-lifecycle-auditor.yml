name: PR Lifecycle Auditor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: pr-lifecycle-auditor-${{ github.repository }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit open PR lifecycle states
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.x"

      - name: Test audit classifications
        run: python -m unittest discover -s tests -p 'test_pr_lifecycle_audit.py' -v

      - name: Run read-only audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python .github/scripts/pr-lifecycle-audit.py
