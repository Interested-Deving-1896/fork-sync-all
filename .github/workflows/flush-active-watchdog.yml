name: Flush Active Watchdog

# Releases a completed protected workflow's FLUSH_ACTIVE lease only when the
# stored lease owner matches that workflow/run identity.
#
# This is the primary mitigation for the force-cancel problem: if the
# lifecycle job is cancelled via the GitHub UI, its always() cleanup step
# does not run, leaving FLUSH_ACTIVE active. The completion router dispatches
# this watchdog, which releases that run's matching lease.
#
# workflow-completion-router dispatches this workflow for protected workflow
# completions. Using one dispatch route avoids workflow_run fan-in while the
# compare-and-clear prevents an older completion from clearing a newer lease.

on:
  workflow_dispatch:
    inputs:
      protected_workflow:
        description: "Exact completed protected workflow name"
        required: true
        type: string
      protected_run_id:
        description: "Completed protected workflow run ID"
        required: true
        type: string
      protected_conclusion:
        description: "Completed protected workflow conclusion"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: flush-active-watchdog
  cancel-in-progress: false

jobs:
  clear-flush-active:
    name: Clear FLUSH_ACTIVE
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # ratchet:step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: false
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Clear FLUSH_ACTIVE repo variable
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          TRIGGERING_WORKFLOW: ${{ inputs.protected_workflow }}
          TRIGGERING_CONCLUSION: ${{ inputs.protected_conclusion }}
          TRIGGERING_RUN_ID: ${{ inputs.protected_run_id }}
        run: |
          source scripts/includes/quota-instrument.sh
          qi_begin

          echo "Watchdog triggered by: ${TRIGGERING_WORKFLOW}" >&2
          echo "  Run ID:    ${TRIGGERING_RUN_ID}" >&2
          echo "  Conclusion: ${TRIGGERING_CONCLUSION}" >&2

          case "${TRIGGERING_WORKFLOW}" in
            "Flush Lifecycle Manager"|"Full Chain Flush"|"Critical Deploy"|"Critical Deploy — All"|"Critical Deploy — OSP"|"Critical Deploy — OOC"|"GitLab Critical Deploy") ;;
            *) echo "Refusing unrecognised protected workflow: ${TRIGGERING_WORKFLOW}" >&2; exit 1 ;;
          esac
          [[ "${TRIGGERING_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Invalid protected run ID" >&2; exit 1; }

          export PIPELINE_LEASE_OWNER="${TRIGGERING_WORKFLOW}:${TRIGGERING_RUN_ID}"
          source scripts/includes/pipeline-guard.sh
          _rc=0
          pipeline_guard_end "watchdog" || _rc=$?
          qi_end
          exit "${_rc}"
