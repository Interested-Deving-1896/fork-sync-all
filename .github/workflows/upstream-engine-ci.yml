name: Upstream Engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/upstream_engine.py"
      - "scripts/upstream_manifests.py"
      - "tests/test_upstream_engine.py"
      - "tests/test_upstream_manifests.py"
      - ".github/workflows/upstream-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/upstream_engine.py"
      - "scripts/upstream_manifests.py"
      - "tests/test_upstream_engine.py"
      - "tests/test_upstream_manifests.py"
      - ".github/workflows/upstream-engine-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile engine and tests
        run: python -m py_compile scripts/upstream_engine.py scripts/upstream_manifests.py tests/test_upstream_engine.py tests/test_upstream_manifests.py
      - name: Run isolated unit tests
        run: python -m unittest tests.test_upstream_engine tests.test_upstream_manifests -v
