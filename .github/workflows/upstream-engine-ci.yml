name: Upstream Engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/upstream_engine.py"
      - "tests/test_upstream_engine.py"
      - ".github/workflows/upstream-engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/upstream_engine.py"
      - "tests/test_upstream_engine.py"
      - ".github/workflows/upstream-engine-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile engine and tests
        run: python -m py_compile scripts/upstream_engine.py tests/test_upstream_engine.py
      - name: Run isolated unit tests
        run: python -m unittest tests.test_upstream_engine -v
