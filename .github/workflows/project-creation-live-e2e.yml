name: Project Creation Live GitHub E2E

on:
  workflow_dispatch:
    inputs:
      confirm_live_test:
        description: "Type CREATE-AND-DELETE to authorize one private disposable repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: project-creation-live-e2e
  cancel-in-progress: false

jobs:
  live-create-and-cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_live_test == 'CREATE-AND-DELETE' &&
      github.repository == 'Interested-Deving-1896/fork-sync-all'
    runs-on: ubuntu-latest
    environment: project-creation-live-e2e
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit
          disable-sudo: true
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned YAML parser dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Execute Project Creation Engine and clean up exact disposable repository
        env:
          PROJECT_CREATION_E2E_TOKEN: ${{ secrets.PROJECT_CREATION_E2E_TOKEN }}
          INPUT_CONFIRM_LIVE_TEST: ${{ github.event.inputs.confirm_live_test }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -m scripts.project_creation_live_e2e
      - name: Preserve non-secret journal for audit and reconciliation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: project-creation-e2e-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/project-creation-e2e.sqlite3*
          if-no-files-found: ignore
          retention-days: 30
