name: Git Platform Sync

# Development hold: preserve the workflow name and dry_run contract, but
# remove scheduled/workflow_run writers until the GitLab sidecar is audited.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only inspection (workflow is paused)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  safety-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Report development hold
        run: |
          echo "::notice::GitHub/GitLab platform sync is paused during mirror development."
          echo "::notice::No repositories, branches, refs, or credentials were changed."
