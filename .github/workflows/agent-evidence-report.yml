name: Agent Evidence Review Report

# Dispatched by workflow-completion-router.yml after relevant CI runs complete.
# This workflow checks out trusted default-branch code and never executes PR code.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed upstream GitHub Actions run ID
        required: true
        type: string
      source_run_attempt:
        description: Completed upstream run attempt
        required: true
        type: string
      source_head_sha:
        description: Exact upstream commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-evidence-report-${{ inputs.source_head_sha }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch governance code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Verify source workflow completion and resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          HEAD_SHA: ${{ inputs.source_head_sha }}
        run: |
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID"; exit 1; }
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[0-9]+$ ]] || { echo "Invalid source run attempt"; exit 1; }
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source head SHA"; exit 1; }
          gh api "repos/${REPO}/actions/runs/${SOURCE_RUN_ID}" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" "$SOURCE_RUN_ATTEMPT" "$HEAD_SHA" <<'PY'
          import json
          import sys

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          if run.get("status") != "completed":
              raise SystemExit("source workflow run is not completed")
          if str(run.get("run_attempt", 1)) != sys.argv[2]:
              raise SystemExit("source workflow run attempt does not match")
          if run.get("head_sha") != sys.argv[3]:
              raise SystemExit("source workflow head SHA does not match")
          PY
          gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls?per_page=100" > "$RUNNER_TEMP/associated-pulls.json"
          number=$(python3 - "$RUNNER_TEMP/associated-pulls.json" "$HEAD_SHA" <<'PY'
          import json
          import sys

          pulls = json.load(open(sys.argv[1], encoding="utf-8"))
          sha = sys.argv[2]
          match = next(
              (pr for pr in pulls
               if pr.get("state") == "open" and pr.get("head", {}).get("sha") == sha),
              None,
          )
          print(match["number"] if match else "")
          PY
          )
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [[ -z "${number}" ]]; then
            echo "No open PR found for workflow head ${HEAD_SHA}; report skipped."
          fi

      - name: Install evidence verifier dependencies
        if: steps.pr.outputs.number != ''
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Re-assess PR evidence (report-only)
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ inputs.source_head_sha }}
        run: python3 scripts/report-agent-evidence-pr.py
