name: Rust Source Modernization

on:
  pull_request:
    paths:
      - "tools/rust-source-modernization/**"
      - ".github/workflows/rust-source-modernization.yml"
  push:
    branches: [main]
    paths:
      - "tools/rust-source-modernization/**"
      - ".github/workflows/rust-source-modernization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-source-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-source-modernization
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned action revision
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run -- validate-manifest examples/manifest.json
      - run: cargo run -- plan examples/manifest.json --json
