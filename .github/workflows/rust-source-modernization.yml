name: Rust Source Modernization

on:
  pull_request:
    paths:
      - "tools/rust-source-modernization/**"
      - ".github/workflows/rust-source-modernization.yml"
  push:
    branches: [main]
    paths:
      - "tools/rust-source-modernization/**"
      - ".github/workflows/rust-source-modernization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-source-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rust-source-modernization
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run -- validate-manifest examples/manifest.json
      - run: cargo run -- plan examples/manifest.json --json
