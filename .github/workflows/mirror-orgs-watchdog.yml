name: Mirror Watchdog

# Triggers when any of the three mirror workflows fail.
# Waits 5 minutes (to allow transient GitHub API issues to clear) then
# retries once. If the retry also fails, the failure surfaces normally
# in the Actions tab and inbox.
#
# Covered workflows:
#   Mirror Interested-Deving-1896 → OSP  (mirror-to-osp.yml)        — hourly at :00
#   Mirror Orgs                          (mirror-orgs-full.yml)      — daily at 02:00
#   Mirror OSP → GitLab                  (mirror-osp-to-gitlab.yml)  — hourly at :30
#   Mirror Releases                      (mirror-releases.yml)       — hourly at :00
#   Mirror Artifacts                     (mirror-artifacts.yml)      — hourly at :00

on:
  # Mirror completions are aggregated by workflow-completion-router.yml.
  workflow_dispatch:
    inputs:
      source_workflow:
        description: "Completed mirror workflow name"
        required: true
        type: string
      source_run_id:
        description: "Completed workflow run ID"
        required: true
        type: string
      source_conclusion:
        description: "Completed workflow conclusion"
        required: true
        type: string
      source_head_branch:
        description: "Completed workflow branch"
        required: false
        default: "main"
        type: string
      source_created_at:
        description: "Completed workflow creation time"
        required: false
        default: ""
        type: string

concurrency:
  # One watchdog retry per workflow at a time — prevents retry storms when
  # a mirror fails repeatedly. Uses the triggering workflow name as the key.
  group: mirror-watchdog-${{ inputs.source_workflow }}
  cancel-in-progress: true # If a newer retry is queued, cancel the older one

permissions:
  actions: write # needed to re-trigger workflows
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.source_conclusion == 'failure'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # ratchet:step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: false
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Log failure context
        run: |
          echo "Mirror workflow failed:"
          echo "  Workflow: ${{ inputs.source_workflow }}"
          echo "  Run ID  : ${{ inputs.source_run_id }}"
          echo "  Branch  : ${{ inputs.source_head_branch }}"
          echo "  Started : ${{ inputs.source_created_at }}"

      - name: Quota pre-flight
        id: quota
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MIN_QUOTA: "1500"
        run: |
          source scripts/includes/quota-snapshot.sh
          quota_snapshot

      - name: Wait before retry
        if: steps.quota.outputs.skip == 'false'
        run: sleep 300 # 5 minutes

      - name: Retry mirror
        if: steps.quota.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          WORKFLOW_NAME: ${{ inputs.source_workflow }}
        run: |
          case "$WORKFLOW_NAME" in
            "Mirror Interested-Deving-1896 → OSP") TARGET=mirror-to-osp.yml ;;
            "Mirror Orgs")                         TARGET=mirror-orgs-full.yml ;;
            "Mirror OSP → GitLab")                 TARGET=mirror-osp-to-gitlab.yml ;;
            "Mirror Releases")                     TARGET=mirror-releases.yml ;;
            "Mirror Artifacts")                    TARGET=mirror-artifacts.yml ;;
            *) echo "Unknown workflow '${WORKFLOW_NAME}' — nothing to retry"; exit 0 ;;
          esac
          echo "Retrying ${TARGET}..."
          gh workflow run "$TARGET" \
            --repo ${{ github.repository }} \
            --ref main
          echo "Retry triggered."

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
