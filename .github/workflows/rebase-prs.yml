name: Update PR Branches

# Keeps open PRs in sync with their base branch.
#
# For each open PR targeting the base branch:
#   - If behind but conflict-free → update via GitHub API using merge or rebase
#   - UPDATE_METHOD defaults to merge; set repository variable BRANCH_UPDATE_METHOD to rebase
#     for scheduled runs, or choose a method during manual dispatch
#   - If conflicting → posts method-specific merge/rebase instructions and flags it
#   - Already-current, optionally skipped draft, blocked, or unstable PRs are skipped
#
# Runs after pushes, Validate Config completions, and daily as a safety net.
# The job-level guard below restricts every write-capable run to the repository's
# current default branch, including manually dispatched and scheduled runs.
# This workflow never merges PRs.

on:
  push:
  workflow_run:
    workflows:
      - "Validate Config"
    types: [completed]
  schedule:
    - cron: '10 5 * * *' # Daily safety sweep at 05:10 UTC
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Only update PRs targeting this base branch (blank = default branch)'
        required: false
        type: string
      pr_filter:
        description: 'Comma-separated PR numbers to process (blank = all open PRs)'
        required: false
        type: string
      update_method:
        description: 'How to update behind branches'
        required: false
        type: choice
        default: merge
        options:
          - merge
          - rebase
      dry_run:
        description: 'Report only — no updates or comments'
        required: false
        type: boolean
        default: false
      skip_drafts:
        description: 'Skip draft PRs'
        required: false
        type: boolean
        default: false
      post_comments:
        description: 'Post a comment on conflicting PRs'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  # Do not cancel an active sweep when another base push arrives; the next run
  # can safely inspect the latest base after the current bounded pass finishes.
  cancel-in-progress: false

# ── Rate limits ───────────────────────────────────────────────────────────────
# Per PR: 1 fetch (PR detail) + 1 update-branch PUT + 1 comment POST (conflicts only)
# Typical run (10 open PRs): ~25–35 REST calls
# Minimum quota required: 500

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    # Every write-capable run must use the repository's current default branch.
    # workflow_run additionally requires a successful Validate Config run whose
    # originating branch is the default branch. This also blocks manual dispatch
    # from a non-default branch and keeps scheduled runs on the default branch.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Quota pre-flight
        id: quota
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MIN_QUOTA: "400"
        run: |
          remaining=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/rate_limit" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['resources']['core']['remaining'])" \
            || echo 0)
          reset_at=$(curl -sf \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/rate_limit" \
            | python3 -c "import sys,json; from datetime import datetime,timezone; r=json.load(sys.stdin)['resources']['core']['reset']; print(datetime.fromtimestamp(r,tz=timezone.utc).strftime('%H:%M UTC'))" \
            || echo "unknown")
          echo "remaining=${remaining}" >> "$GITHUB_OUTPUT"
          if [[ "${remaining}" -lt "${MIN_QUOTA}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Update PR Branches — quota too low" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Remaining | ${remaining} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Threshold | ${MIN_QUOTA} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Quota resets | ${reset_at} |" >> "$GITHUB_STEP_SUMMARY"
            echo "_rate-limit-rerun.yml will re-trigger this workflow after the reset._" >> "$GITHUB_STEP_SUMMARY"
            echo "[update-branches] Quota too low (${remaining} < ${MIN_QUOTA}) — skipping (resets ${reset_at})" >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[update-branches] Quota OK (${remaining} >= ${MIN_QUOTA}) — proceeding" >&2
          fi

      - name: Check FSA mode
        id: fsa
        if: steps.quota.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FSA_MANAGED: ${{ vars.FSA_MANAGED }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          source scripts/includes/fsa-mode.sh
          if fsa_is_managed; then
            echo "managed=true" >> "$GITHUB_OUTPUT"
            echo "Managed by fork-sync-all — PR branch updates handled centrally, skipping."
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR Branches
        if: steps.quota.outputs.skip == 'false' && steps.fsa.outputs.managed == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_FILTER: ${{ inputs.base_branch || '' }}
          PR_FILTER: ${{ inputs.pr_filter || '' }}
          # Manual dispatch overrides the repository variable; merge is the safe default.
          UPDATE_METHOD: ${{ inputs.update_method || vars.BRANCH_UPDATE_METHOD || 'merge' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SKIP_DRAFTS: ${{ inputs.skip_drafts == true && 'true' || 'false' }}
          POST_COMMENTS: ${{ inputs.post_comments == false && 'false' || 'true' }}
          MIN_QUOTA: "500"
          BUDGET_MINUTES: "25"
        run: bash scripts/rebase-prs.sh

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
