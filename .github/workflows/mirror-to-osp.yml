name: Mirror Interested-Deving-1896 → OSP

# Until the source → OSP leg has its own non-destructive planner, this
# workflow is intentionally read-only. DRY_RUN is pinned true regardless
# of the dispatch input; the legacy git push --mirror path is unreachable.
on:
  schedule:
    - cron: '17 1/6 * * *'
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Inspect only this repo name (leave blank for all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Read-only inspection (forced true during development)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mirror-to-osp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # ratchet:step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: false
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
      - name: Detect chain position
        id: node
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FSA_MANAGED: ${{ vars.FSA_MANAGED }}
          REPO_OWNER: ${{ github.repository_owner }}
          FSA_CHAIN_POSITION: ""
          FSA_UPSTREAM_OWNER: ""
        run: |
          source scripts/includes/fsa-node-identity.sh
          fsa_node_detect
          fsa_node_summary
      - name: Inspect matched repos from upstream for OSP
        if: steps.node.outputs.fsa_node_position != 'mirror'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM_OWNER: ${{ steps.node.outputs.fsa_node_owner }}
          OSP_ORG: OpenOS-Project-OSP
          BUDGET_MINUTES: "25"
          REPO_FILTER: ${{ inputs.repo_filter || '' }}
          DRY_RUN: "true"
          FORCE: "false"
        run: |
          source scripts/includes/quota-instrument.sh
          qi_begin
          bash scripts/mirror-to-osp.sh
          qi_end
      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: bash scripts/write-summary.sh
