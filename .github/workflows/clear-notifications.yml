name: Clear All Notifications

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Inbox scope to mark read"
        type: choice
        required: true
        default: repository
        options:
          - repository
          - all
      dry_run:
        description: "Report the operation without changing notification state"
        type: boolean
        required: true
        default: true
      confirm_all:
        description: "Confirm changing the token owner's entire GitHub inbox"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark notifications as read
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SCOPE: ${{ inputs.scope }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_ALL: ${{ inputs.confirm_all }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$SCOPE" == "all" && "$CONFIRM_ALL" != "true" ]]; then
            echo "::error::scope=all requires confirm_all=true."
            exit 1
          fi

          endpoint="https://api.github.com/repos/${REPO}/notifications"
          description="notifications for ${REPO}"
          if [[ "$SCOPE" == "all" ]]; then
            endpoint="https://api.github.com/notifications"
            description="the token owner's entire GitHub inbox"
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[dry-run] Would mark ${description} as read."
            exit 0
          fi

          curl -sSf \
            -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$endpoint" \
            -d '{"read":true}'
          echo "Marked ${description} as read."
