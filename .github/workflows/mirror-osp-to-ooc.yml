name: Mirror OSP → OOC (read-only preflight)

# This workflow is an offline/read-only development preflight only.
# It cannot push refs. A future write-capable canary requires a separate PR.
on:
  schedule:
    - cron: "49 1/6 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-osp-to-ooc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: github.repository == 'OpenOS-Project-OSP/lkm'
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build read-only mirror plan
        run: python3 scripts/mirror_chain_push.py
