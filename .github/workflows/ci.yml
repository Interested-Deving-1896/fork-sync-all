name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/FUNDING.yml'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${REPO_NAME}
        uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck || true

      - name: Run shellcheck on all scripts
        run: |
          find . -name "*.sh" -not -path "./.git/*" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2034,SC1091 \
            --shell=bash

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${REPO_NAME}
        uses: actions/checkout@v6

      - name: Install bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bats || true

      - name: Run unit tests
        run: bats tests/
