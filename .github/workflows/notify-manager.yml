name: Notification Manager

# Notification triage after a successful Resolve CI Failures run: fetches
# unread GitHub notifications, auto-marks known-safe patterns as read, and
# writes a summary for visibility. Manual dispatch supports read-only audits
# and explicit triage actions without creating an hourly queue backlog.
#
# Also supports manual dispatch with full action control.

on:
  workflow_run:
    workflows: ["Resolve CI Failures"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: false
        default: "auto-triage"
        type: choice
        options:
          - auto-triage
          - list
          - mark-all-read
      scope:
        description: "Notification scope"
        required: false
        default: "unread"
        type: choice
        options:
          - unread
          - all
          - participating
      filter_type:
        description: "Filter by notification type (blank = all)"
        required: false
        default: ""
      filter_repo:
        description: "Filter by repo name substring (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — report without marking read"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: notify-manager
  cancel-in-progress: false

jobs:
  manage:
    name: Triage notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - name: Quota pre-flight
        id: quota
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MIN_QUOTA: "200"
        run: source scripts/includes/quota-snapshot.sh && quota_snapshot

      - name: Fetch and summarise notifications
        if: steps.quota.outputs.skip == 'false'
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SCOPE: ${{ github.event.inputs.scope || 'unread' }}
        run: |
          all_flag="false"
          [[ "$SCOPE" == "all" ]] && all_flag="true"
          participating_flag="false"
          [[ "$SCOPE" == "participating" ]] && participating_flag="true"

          NOTIFS_FILE="/tmp/notifs.json"
          if ! http_code=$(curl -sS \
            -o "$NOTIFS_FILE" \
            -w "%{http_code}" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/notifications?all=${all_flag}&participating=${participating_flag}&per_page=100"); then
            echo "::error::Notifications API request failed before an HTTP response was received."
            exit 1
          fi

          if [[ "$http_code" != "200" ]]; then
            message=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('message','unknown error'))" "$NOTIFS_FILE" 2>/dev/null || echo "unknown error")
            echo "::error::Notifications API returned HTTP ${http_code}: ${message}"
            exit 1
          fi

          if ! python3 -c "import json,sys; data=json.load(open(sys.argv[1])); assert isinstance(data,list)" "$NOTIFS_FILE"; then
            echo "::error::Notifications API returned an invalid response body."
            exit 1
          fi

          total=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$NOTIFS_FILE")
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "notifs_file=${NOTIFS_FILE}" >> "$GITHUB_OUTPUT"

          echo "## Notification Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scope:** \`${SCOPE}\` | **Notifications returned:** ${total}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Breakdown by reason — read from file to avoid ARG_MAX
          python3 scripts/notify-summary.py "$NOTIFS_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-triage known-safe patterns
        if: >
          steps.quota.outputs.skip == 'false' &&
          steps.fetch.outputs.total != '0' &&
          ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'auto-triage'))
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NOTIFS_FILE: ${{ steps.fetch.outputs.notifs_file }}
        run: |
          marked=0
          skipped=0
          failed=0

          # Read from file — avoids ARG_MAX when inbox is large
          NOTIFS_FILE="${NOTIFS_FILE:-/tmp/notifs.json}"
          [[ -f "$NOTIFS_FILE" ]] || { echo "No notifications file found — skipping triage."; exit 0; }

          ids=$(python3 scripts/notify-triage-ids.py "$NOTIFS_FILE" 2>/dev/null)

          if [[ -z "$ids" ]]; then
            echo "No known-safe notifications found — nothing to triage."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Auto-triage:** no known-safe patterns found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r nid; do
            [[ -z "$nid" ]] && continue
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry-run] Would mark read: ${nid}"
              (( skipped++ )) || true
            else
              if curl -sf -X PATCH \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/notifications/threads/${nid}" \
                >/dev/null 2>&1; then
                (( marked++ )) || true
              else
                echo "::warning::Failed to mark notification ${nid} as read."
                (( failed++ )) || true
              fi
            fi
          done <<< "$ids"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "**Auto-triage (dry run):** would mark ${skipped} notification(s) as read." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Auto-triage:** marked ${marked} notification(s) as read; ${failed} failed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Auto-triage complete: marked ${marked} notification(s) as read."
          [[ "$failed" -eq 0 ]]

      - name: Mark all read
        if: >
          steps.quota.outputs.skip == 'false' &&
          github.event.inputs.action == 'mark-all-read' &&
          github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          curl -sSf -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/notifications" \
            -d '{"read":true}' \
            >/dev/null 2>&1
          echo "All notifications marked as read."
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action:** marked all notifications as read." >> "$GITHUB_STEP_SUMMARY"

      - name: List notifications (manual)
        if: >
          steps.quota.outputs.skip == 'false' &&
          github.event.inputs.action == 'list'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FILTER_TYPE: ${{ github.event.inputs.filter_type || '' }}
          FILTER_REPO: ${{ github.event.inputs.filter_repo || '' }}
        run: |
          args=(--list --scope "${{ github.event.inputs.scope || 'unread' }}")
          [[ -n "$FILTER_TYPE" ]] && args+=(--filter "$FILTER_TYPE")
          [[ -n "$FILTER_REPO" ]] && args+=(--filter-repo "$FILTER_REPO")
          bash scripts/notifications.sh "${args[@]}"
