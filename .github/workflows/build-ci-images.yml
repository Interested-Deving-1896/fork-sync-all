name: Build CI images

on:
  push:
    branches: ["main"]
    paths:
      - ".github/images/**"
  # Allow manual rebuild when base images update.
  workflow_dispatch:

jobs:
  opensuse-tumbleweed-ci:
    if: github.repository == 'OSPF1896/${REPO_NAME}'
    name: opensuse-tumbleweed-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/images/opensuse-tumbleweed-ci
          push: true
          tags: |
            ghcr.io/interested-deving-1896/opensuse-tumbleweed-ci:latest
            ghcr.io/interested-deving-1896/opensuse-tumbleweed-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=openSUSE Tumbleweed with tar+git+sh for GitHub Actions

  voidlinux-ci:
    if: github.repository == 'OSPF1896/${REPO_NAME}'
    name: voidlinux-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/images/voidlinux-ci
          push: true
          tags: |
            ghcr.io/interested-deving-1896/voidlinux-ci:latest
            ghcr.io/interested-deving-1896/voidlinux-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Void Linux with tar+git+sh for GitHub Actions
