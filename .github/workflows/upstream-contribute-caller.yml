name: Upstream Contribute (paused)

# The reusable implementation referenced by the former caller does not exist
# at its pinned ref or on main. Keep this manual-only notice in place until a
# reviewed reusable workflow and its write/security contract are implemented.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    name: Explain paused upstream contribution feature
    runs-on: ubuntu-latest
    steps:
      - name: Explain why the workflow is paused
        run: |
          echo "::warning::Upstream contribution automation is paused."
          echo "The reusable workflow is not currently available, so this workflow"
          echo "does not analyze files, call an AI provider, or create upstream PRs."
          echo "Restore automation only after the reusable workflow, target-upstream"
          echo "contract, input validation, and least-privilege PR permissions are reviewed."
